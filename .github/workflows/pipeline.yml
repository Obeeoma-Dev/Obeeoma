name: Obeeoma CI/CD

# Trigger workflow on pushes and pull requests to main & tests branches
on:
  push:
    branches: [main, tests]
  pull_request:
    branches: [main, tests]

  workflow_dispatch: # Manual trigger from GitHub Actions UI.    
    

jobs:
  # -----------------------
  # 1. LINTING & FORMATTING
  # -----------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint (fails if lint errors exist)
      - name: Run ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

    # Step 5a: Check Prettier formatting (fails if formatting issues exist)
      - name: Prettier formatting
        run: npx prettier --write

      # Step 5: Check Prettier formatting (fails if formatting issues exist)
      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"

      # Step 6: TypeScript compile check (fails on type errors)
      - name: TypeScript Compile Check
        run: npx tsc --noEmit

  # ----------------
  # 2. TESTING JOB
  # ----------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint  # Only run tests if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Run Jest tests with coverage
      - name: Run Jest Tests
        run: npm test -- --coverage --watchAll=false

      # Upload coverage report for inspection
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ----------------
  # 3. BUILD REACT APP
  # ----------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Build React app
      - name: Build React App
        run: npm run build

      # Verify build folder exists
      - name: Verify Build Folder Exists
        run: |
          BUILD_PATH="./dist"
          if [ ! -d "$BUILD_PATH" ]; then
            echo "Error: dist folder not found at $BUILD_PATH!"
            exit 1
          fi

      # Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obeeoma-app-build
          path: ./dist

  # ----------------
  # 4. DEPLOY TO RENDER
  # ----------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build  # Only deploy if build succeeds
    if: github.ref == 'refs/heads/main' && success()  # Only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: obeeoma-app-build
          path: ./dist

      # Trigger Render deployment
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId":"service-xxxx","branch":"main"}' \
            https://api.render.com/v1/services/service-xxxx/deploys
