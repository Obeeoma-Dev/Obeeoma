name: Obeeoma CI/CD

# Trigger workflow on pushes and pull to main & develop branches
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # -----------------------
  # 1. LINTING & FORMATTING
  # -----------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner provided by GitHub

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v4  # Pulls your code into the runner so it can be linted and tested

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Use Node.js version 20 for compatibility with your tooling

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci  # Installs exact versions from package-lock.json for reproducibility

      # Step 4: Run ESLint to check for code issues (fails if any errors or warnings)
      - name: Run ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0
        # Lints all JavaScript and TypeScript files in the src folder
        # --max-warnings=0 ensures the job fails even if there are warnings

      # Syep 5: Automatically fix Prettier formatting issues
      - name: Auto-fix Prettier formatting
        run: npx prettier --write "src/**/*.{js,jsx,ts,tsx}"
        # This rewrites files in the src folder to match your Prettier config
        # It’s safe and automatic—no manual edits needed

      # Step 6: Check Prettier formatting (fails if any file is still misformatted)
      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"
        # Verifies that all files are properly formatted
        # If any file is not formatted, the job fails

      # Step 7: TypeScript compile check (fails on type errors)
      - name: TypeScript Compile Check
        run: npx tsc --noEmit
        # Runs the TypeScript compiler to catch type errors
        # --noEmit ensures no files are generated—just a type check

  # ----------------
  # 2. TESTING JOB
  # ----------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint # only run tests if lint passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Run tests and generate coverage report
      - name: Run Tests with Coverage
        run: npm test -- --coverage --watchAll=false

      # Upload coverage report as artifact for later inspection
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ----------------
  # 3. BUILD REACT APP
  # ----------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    # needs: test # only build if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Build a React application
      - name: Build React App
        run: npm run build

      # Logging in to docker hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      # Build and push Docker image 
      - name: Build and Push Docker Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/obeeoma:latest
        
      # Deploy to digital ocean via ssh
      - name: Deploy to Digital Ocean via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
            host: ${{ secrets.DROPLET_IP }}
            username: root
            key: ${{ secrets.DROPLET_SSH_KEY }}
            port: ${{ secrets.DROPLET_SSH_PORT }}
            script: |
                docker pull ${{secrets.DOCKER_USERNAME}}/obeeoma:latest
                docker stop obeeoma || true
                docker rm obeeoma || true
                docker run -d -p 80:80 --name obeeoma ${{secrets.DOCKER_USERNAME}}/obeeoma:latest  
             
     
     