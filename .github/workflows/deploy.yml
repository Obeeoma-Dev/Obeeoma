name: Obeeoma CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20
  DEPLOY_DIR: /home/obeeoma/obeeoma_project

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: obeeoma
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -euo pipefail
            
            cd "${{ env.DEPLOY_DIR }}"

            # Setup Git SSH for sub-repositories (Frontend/Obeeoma)
            DEPLOY_KEY="$HOME/.ssh/github_deploy_ed25519"
            if [ -f "$DEPLOY_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY} -o StrictHostKeyChecking=no"
            fi

            echo "--- STEP 1: Sync Main Repository ---"
            git fetch --all
            git reset --hard origin/main
            
            # The '-e' flag protects these folders from being deleted by Git
            git clean -fd -e Obeeoma/ -e api/

            echo "--- STEP 2: Update Sub-Repositories ---"
            # Pull latest changes for the Frontend repo
            if [ -d "Obeeoma/.git" ]; then
              echo "Updating Frontend (Obeeoma)..."
              cd Obeeoma && git pull origin main && cd ..
            else
              echo "SKIP: Obeeoma folder is missing or not a git repo."
            fi

            # Pull latest changes for the Backend (api) repo
            if [ -d "api/.git" ]; then
              echo "Updating Backend (api)..."
              cd api && git pull origin main && cd ..
            fi

            echo "--- STEP 3: Inject Secrets ---"
            # Ensure the api directory exists before writing the .env
            mkdir -p ./api
            echo "${{ secrets.BACKEND_ENV_FILE }}" > ./api/.env

            echo "--- STEP 4: Docker Rebuild ---"
            # Force stop all containers to release Port 80 and Port 8000
            docker compose down --remove-orphans

            # Clear builder cache to prevent 'EOF' registry errors
            docker builder prune -f

            # Build and restart the entire stack
            COMPOSE_HTTP_TIMEOUT=240 docker compose up -d --build

            echo "--- STEP 5: Cleanup ---"
            # Remove old unused images to save disk space
            docker image prune -f
            echo "Deployment successful!"
