name: Obeeoma CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20
  DEPLOY_REPO_SSH: git@github.com:Obeeoma-Dev/Obeeoma.git
  DEPLOY_BRANCH: main
  DEPLOY_DIR: /home/obeeoma/obeeoma_project/Obeeoma

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Auto-fix Prettier formatting
        run: npx prettier --write "src/**/*.{js,jsx,ts,tsx}"

      - name: Prettier Check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"

      - name: TypeScript Check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: obeeoma
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -euo pipefail

            REPO_SSH="${{ env.DEPLOY_REPO_SSH }}"
            BRANCH="${{ env.DEPLOY_BRANCH }}"
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            DEPLOY_KEY="$HOME/.ssh/github_deploy_ed25519"

            echo "Deploy: ensure directory exists"
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR"
              chown "$(whoami)":"$(whoami)" "$DEPLOY_DIR" || true
            fi

            cd "$DEPLOY_DIR"

            # Ensure we have a git repo; if not, clone fresh
            if [ ! -d ".git" ]; then
              echo ".git not found — cloning repository into $DEPLOY_DIR"
              rm -rf "$DEPLOY_DIR"/*
              git clone "$REPO_SSH" .
              git checkout "$BRANCH"
            fi

            # Use the deploy key on the server; adjust path if different
            if [ -f "$DEPLOY_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            fi

            echo "Fetching latest from origin/$BRANCH.."
            git fetch --all --prune

            echo "Updating to latest code..."
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Checked out $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

            # ---------------------------------------------------------
            # Handle Backend Repository
            # ---------------------------------------------------------
            # ---------------------------------------------------------
            # Handle Backend Repository
            # ---------------------------------------------------------
            BACKEND_REPO_SSH="git@github.com:Obeeoma-Dev/api.git" 
            BACKEND_DIR="/home/obeeoma/obeeoma_project/Backend" # Context for docker compose build (../Backend/api)

            echo "Deploy: ensure backend directory exists at $BACKEND_DIR"
            if [ ! -d "$BACKEND_DIR" ]; then
              mkdir -p "$BACKEND_DIR"
              chown "$(whoami)":"$(whoami)" "$BACKEND_DIR" || true
            fi

            # Using the same deploy key for backend
            if [ -f "$DEPLOY_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            fi

            if [ ! -d "$BACKEND_DIR/.git" ]; then
              echo "Cloning Backend repository..."
              # Remove directory content if it exists but isn't a git repo (clean slate)
              # Also cleaning up the old/wrong directory if it exists to avoid confusion (optional)
              rm -rf "/home/obeeoma/obeeoma_project/api" || true

              if [ -d "$BACKEND_DIR" ] && [ "$(ls -A $BACKEND_DIR)" ]; then
                 echo "Warning: $BACKEND_DIR exists and is not empty. Cleaning up..."
                 rm -rf "$BACKEND_DIR"/*
              fi
              git clone "$BACKEND_REPO_SSH" "$BACKEND_DIR"
              cd "$BACKEND_DIR"
              git checkout "$BRANCH" || echo "Branch $BRANCH not found in Backend, staying on default"
            else
              echo "Updating Backend repository..."
              cd "$BACKEND_DIR"
              # FORCE SSH URL to fix "fatal: could not read Username for 'https://...'" error
              git remote set-url origin "$BACKEND_REPO_SSH"
              git fetch --all --prune
              git checkout "$BRANCH" || echo "Branch $BRANCH not found in Backend, staying on default"
              git reset --hard "origin/$BRANCH" || git reset --hard "origin/HEAD"
            fi

            # Return to Obeeoma directory
            cd "$DEPLOY_DIR"

            echo "Verifying docker-compose.yml exists..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found in $DEPLOY_DIR"
              exit 1
            fi

            echo "Stopping existing containers..."
            docker compose down || true

            echo "Building Docker images..."
            docker compose build

            echo "Starting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning up dangling Docker images..."
            docker image prune -f

            echo "Deployment completed successfully"
