name: Obeeoma CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20

jobs:
  # -----------------------
  # 1. LINT & TYPE CHECK
  # -----------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Prettier Check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"

      - name: TypeScript Check
        run: npx tsc --noEmit

  # -----------------------
  # 2. TESTS
  # -----------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

  # -----------------------
  # 3. DEPLOY (BUILD ON SERVER)
  # -----------------------
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: obeeoma
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}

          timeout: 30m
          command_timeout: 30m

          script: |
            set -e

            echo " Moving to project directory..."
            cd /home/obeeoma/obeeoma_project/Obeeoma

            if [ ! -d ".git" ]; then
              echo "Error: Not a git repository"
              exit 1
            fi

            echo "Pulling latest code from GitHub..."
            GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_ed25519 -o IdentitiesOnly=yes" \
              git pull origin main

            echo "Building Docker image..."
            docker compose build frontend

            echo "Restarting containers..."
            docker compose up -d frontend --remove-orphans

            echo "Cleaning up dangling Docker images..."
            docker image prune -f

            echo "Deployment completed successfully"


