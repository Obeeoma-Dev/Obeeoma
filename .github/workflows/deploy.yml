name: Obeeoma CI/CD

on:
  push:
    branches: [main]

env:
  NODE_VERSION: 20
  DEPLOY_DIR: /home/obeeoma/obeeoma_project

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: obeeoma
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          timeout: 60m
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_DIR }}"

            echo "--- STEP 1: Sync Main Repository ---"
            # Fetch and Force Reset to kill "Divergent Branch" errors
            git fetch origin main
            git reset --hard origin/main
            
            # Protect Obeeoma/ and api/ from being wiped during cleanup
            git clean -fd -e Obeeoma/ -e api/

            echo "--- STEP 2: Force Sync Sub-Repositories ---"
            # Using 'reset --hard' instead of 'pull' ensures the server matches GitHub exactly
            if [ -d "Obeeoma/.git" ]; then
              echo "Resetting Frontend (Obeeoma)..."
              cd Obeeoma && git fetch origin main && git reset --hard origin/main && cd ..
            fi

            if [ -d "api/.git" ]; then
              echo "Resetting Backend (api)..."
              cd api && git fetch origin main && git reset --hard origin/main && cd ..
            fi

            # echo "--- STEP 3: Fix Path Nesting ---"
            # # This fixes the "Obeeoma/Obeeoma not found" error by flattening the folder structure
            # if [ -d "Obeeoma/Obeeoma" ]; then
            #   echo "Flattening nested Obeeoma folder..."
            #   mv Obeeoma/Obeeoma/* Obeeoma/ 2>/dev/null || true
            #   mv Obeeoma/Obeeoma/.* Obeeoma/ 2>/dev/null || true
            #   rm -rf Obeeoma/Obeeoma
            # fi

            echo "--- STEP 4: Inject Secrets ---"
            # Ensure the api directory exists before writing the .env
            mkdir -p ./api
            echo "${{ secrets.BACKEND_ENV_FILE }}" > ./api/.env

            echo "--- STEP 5: Docker Rebuild ---"
            # 1. Stop containers to release Ports 80 and 8000
            docker compose down --remove-orphans
            
            # 2. Clear builder cache (Fixes the EOF/Registry connection errors)
            docker builder prune -a -f 

            # 3. Build and Start the stack
            COMPOSE_HTTP_TIMEOUT=240 docker compose up -d --build

            echo "--- STEP 6: Cleanup ---"
            docker image prune -f
            echo "Deployment successful!"

