name: Obeeoma CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20
  DEPLOY_REPO_SSH: git@github.com:Obeeoma-Dev/Obeeoma.git
  DEPLOY_BRANCH: main
  DEPLOY_DIR: /home/obeeoma/obeeoma_project/Obeeoma

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Auto-fix Prettier formatting
        run: npx prettier --write "src/**/*.{js,jsx,ts,tsx}"

      - name: Prettier Check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"

      - name: TypeScript Check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: obeeoma
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -euo pipefail

            REPO_SSH="${{ env.DEPLOY_REPO_SSH }}"
            BRANCH="${{ env.DEPLOY_BRANCH }}"
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            DEPLOY_KEY="$HOME/.ssh/github_deploy_ed259"

            echo "Deploy: ensure directory exists"
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR"
              chown "$(whoami)":"$(whoami)" "$DEPLOY_DIR" || true
            fi

            cd "$DEPLOY_DIR"

            # Ensure we have a git repo; if not, clone fresh
            if [ ! -d ".git" ]; then
              echo ".git not found — cloning repository into $DEPLOY_DIR"
              rm -rf "$DEPLOY_DIR"/*
              git clone "$REPO_SSH" .
              git checkout "$BRANCH"
            fi

            # Use the deploy key on the server; adjust path if different
            if [ -f "$DEPLOY_KEY" ]; then
              export GIT_SSH_COMMAND="ssh -i ${DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            fi

            echo "Fetching latest from origin/$BRANCH..."
            git fetch --all --prune

            # Force reset to remote branch to avoid 'local changes would be overwritten'
            echo "Resetting worktree to origin/$BRANCH (this will discard uncommitted changes on the server)"
            git reset --hard "origin/$BRANCH"

            # Remove untracked/ignored files that might interfere with build
            git clean -fdx

            echo "Checked out $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

            echo "Building Docker image..."
            docker compose build frontend

            echo "Restarting containers..."
            docker compose up -d frontend --remove-orphans

            echo "Cleaning up dangling Docker images..."
            docker image prune -f

            echo "Deployment completed successfully"
