name: Obeeoma CI/CD

# Trigger workflow on pushes and pull to main & develop branches
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # -----------------------
  # 1. LINTING & FORMATTING
  # -----------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint checks (fail if issues exist)
      - name: Run ESLint Check
        run: npx eslint src

      # Step 5: Run Prettier checks (fail if formatting issues exist)
      - name: Run Prettier Check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx}"

      # Step 6: TypeScript compile check (fail on type errors)
      - name: TypeScript Compile Check
        run: npx tsc --noEmit

