name: Obeeoma CI/CD

# Trigger workflow on pushes and PRs to main & develop branches
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # -----------------------
  # 1. LINTING & FORMATTING
  # -----------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      # Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies exactly from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Run ESLint auto-fix
      - name: Run ESLint Auto-Fix
        run: npx eslint src --fix

      # Run Prettier auto-fix
      - name: Run Prettier Auto-Fix
        run: npx prettier --write "src/**/*.{js,jsx}"

      # Check ESLint errors that couldn't be fixed automatically
      - name: Check ESLint Remaining Errors
        run: npx eslint src

      # Check Prettier formatting that couldn't be fixed automatically
      - name: Check Prettier Formatting
        run: npx prettier --check "src/**/*.{js,jsx}"

  # --------------
  # 2. TESTING JOB
  # --------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint # only run tests if lint job succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Run tests with coverage; disable watch mode for CI
      - name: Run Tests with Coverage
        run: npm test -- --coverage --watchAll=false

      # Save coverage report as GitHub artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ----------------
  # 3. BUILD REACT APP
  # ----------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test # only build if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Build production-ready React app
      - name: Build React App
        run: |
          echo "Running build..."
          npm run build
          echo "Build finished."

      # Safety check: ensure build folder exists before uploading
      - name: Verify dist folder exists
        run: |
          BUILD_PATH="./dist"
          if [ ! -d "$BUILD_PATH" ]; then
            echo "Error: dist folder not found at $BUILD_PATH!"
            exit 1
          fi

      # Save build folder as artifact for deployment
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obeeoma-app-build
          path: ./dist

  # ----------------
  # 4. DEPLOY TO RENDER
  # ----------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build # deploy only if build succeeds
    if: github.ref == 'refs/heads/main' && success() # only deploy from main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifact produced in the build step
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: obeeoma-app-build
          path: ./dist

      # Trigger a new Render deployment
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId":"service-xxxx","branch":"main"}' \
            https://api.render.com/v1/services/service-xxxx/deploys
