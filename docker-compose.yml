services:
  frontend:
    build:
      # This tells Docker: "Go into the Obeeoma folder and look for the Dockerfile"
      context: ./Obeeoma
      dockerfile: Dockerfile
    container_name: obeeoma_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./Backend
    container_name: obeeoma_backend
    expose:
      - "8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/staticfiles:/app/staticfiles
      - ./Backend/media:/app/media
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 api.wsgi:application

  nginx:
    image: nginx:alpine
    container_name: obeeoma_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Backend/staticfiles:/app/staticfiles:ro
      - ./Backend/media:/app/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped